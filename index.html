<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta name="theme-color" content="#1f2430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="油价雷达">
<meta name="description" content="国内成品油调价、下一轮涨跌预测、窗口倒计时、各省油价">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%231f2430'/%3E%3Cg fill='none' stroke='%234d6bfe' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M12 5a7 7 0 1 0 7 7'/%3E%3Cpath d='M12 12 17 7'/%3E%3Cpath d='M12 9a3 3 0 1 0 3 3'/%3E%3C/g%3E%3C/svg%3E">
<title>油价雷达</title>
<style>
:root{
  --bg:#eef0f4; --card:#fff; --line:#e9ecf2; --line-soft:#f2f4f8;
  --ink:#1f2430; --ink-2:#5b6474; --ink-3:#8b93a3;
  --up:#e5484d; --down:#0aa06e; --brand:#4d6bfe; --warn:#b26a00; --warn-bg:#fff7e6;
  --hero-a:#2b3243; --hero-b:#1f2430; --shadow:0 2px 12px rgba(31,36,48,.06);
  --gas:#4d6bfe; --diesel:#e0a020;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12151c; --card:#1b1f28; --line:#272c37; --line-soft:#22262f;
    --ink:#e8ebf2; --ink-2:#a7b0c0; --ink-3:#79808f;
    --up:#ff6b70; --down:#34d399; --brand:#7d93ff; --warn:#e3b341; --warn-bg:#2c2617;
    --hero-a:#262d3c; --hero-b:#1a1f29; --shadow:0 2px 12px rgba(0,0,0,.3);
    --gas:#7d93ff; --diesel:#e8b93f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:720px;margin:0 auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:16px;padding:16px 16px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title{font-size:15px;font-weight:600}
.card-note{font-size:12px;color:var(--ink-3)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;background:var(--line-soft);color:var(--ink-3);white-space:nowrap}
.chip-live{background:rgba(77,107,254,.14);color:var(--brand)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--ink-3)}
.divider{height:1px;background:var(--line-soft);margin:14px 0}
.muted{color:var(--ink-3);font-size:13px}
.note{font-size:12px;color:var(--ink-3);line-height:1.6;margin-top:12px}
.center{text-align:center}

/* 顶栏 */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 14px}
.stamp{font-size:12px;color:var(--ink-3)}
.refresh{border:0;background:rgba(77,107,254,.12);color:var(--brand);font-size:13px;padding:7px 16px;border-radius:999px;font-family:inherit}
.refresh:active{opacity:.6}
.warn{background:var(--warn-bg);color:var(--warn);font-size:12.5px;padding:9px 12px;border-radius:10px;margin-bottom:14px}

/* 主卡 */
.hero{background:linear-gradient(150deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 22px rgba(31,36,48,.18)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-title{font-size:13px;color:rgba(255,255,255,.66)}
.hero-badge{font-size:12px;padding:3px 11px;border-radius:999px;background:rgba(255,255,255,.15)}
.hero-date{display:block;font-size:12.5px;color:rgba(255,255,255,.5);margin-top:10px}
.hero-delta{display:block;font-size:44px;font-weight:600;letter-spacing:-1px;line-height:1.15;margin-top:2px}
.hero-delta.up{color:#ff7a7f} .hero-delta.down{color:#4fd39b} .hero-delta.flat{color:#fff}
.hero-unit{font-size:14px;font-weight:400;color:rgba(255,255,255,.6);margin-left:8px}
.hero-grid{display:flex;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,.12)}
.hero-cell{flex:1}
.hero-k{display:block;font-size:12px;color:rgba(255,255,255,.5)}
.hero-v{display:block;font-size:24px;font-weight:600;margin-top:2px}
.hero-u{display:block;font-size:12px;color:rgba(255,255,255,.5)}
.hero-foot{margin-top:12px;font-size:12px;color:rgba(255,255,255,.45)}

/* 预测 */
.fc-main{display:flex;align-items:baseline;gap:8px}
.fc-mag{font-size:40px;font-weight:600;letter-spacing:-1px}
.fc-unit{font-size:13px;color:var(--ink-3)}
.fc-badge{display:inline-block;font-size:14px;font-weight:600;padding:4px 13px;border-radius:999px;margin-top:6px}
.fc-badge.up{background:rgba(229,72,77,.12)} .fc-badge.down{background:rgba(10,160,110,.12)}
.fc-badge.flat{background:var(--line-soft);color:var(--ink-3)}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 0}
.kv-k{font-size:13px;color:var(--ink-3)}
.kv-v{font-size:14px;font-variant-numeric:tabular-nums}

/* 倒计时 */
.countdown{display:flex;gap:6px;align-items:flex-end}
.cd-cell{flex:1;text-align:center;background:var(--line-soft);border-radius:12px;padding:10px 2px}
.cd-num{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.cd-unit{font-size:11px;color:var(--ink-3);display:block}
.cd-expired{font-size:17px;font-weight:600;color:var(--brand);padding:10px 0}

/* 图表 */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-3);margin-top:10px}
.legend i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* 列表 */
.search{display:flex;align-items:center;gap:8px;background:var(--line-soft);border-radius:10px;padding:0 12px;margin-bottom:10px}
.search input{flex:1;border:0;background:transparent;color:var(--ink);font-size:14px;height:40px;outline:none;font-family:inherit}
.search button{border:0;background:transparent;color:var(--brand);font-size:13px;padding:6px 0;font-family:inherit}
.rows{max-height:60vh;overflow:auto;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:6px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-variant-numeric:tabular-nums}
.row:last-child{border-bottom:0}
.rows .row[data-copy]{cursor:pointer}
.row.head{padding:6px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
.row.head span{font-size:12px;color:var(--ink-3)}
.c-name{flex:1.15;font-size:14px}
.c-date{flex:1.35;font-size:13px}
.c-num{flex:1;text-align:right;font-size:14px}
.c-delta{flex:1.05;text-align:right;font-size:13px}

/* 状态 */
.skeleton{height:110px;border-radius:16px;background:var(--card);margin-bottom:14px;animation:pulse 1.4s ease-in-out infinite}
.skeleton.tall{height:220px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.err{color:var(--up);font-size:14px;word-break:break-all;margin:10px 0}
.btn{display:block;width:100%;margin-top:16px;height:44px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:15px;font-family:inherit}

/* 页脚 */
.foot{padding:2px 6px 20px}
.foot-title{font-size:12px;color:var(--ink-3);margin-bottom:8px}
.foot a{color:var(--brand);text-decoration:none;font-size:12.5px;display:block;line-height:2}
.foot-note{font-size:11.5px;color:var(--ink-3);line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div id="topbar" hidden>
    <div class="topbar">
      <span class="stamp" id="meta"></span>
      <button class="refresh" id="btn-refresh" type="button">刷新</button>
    </div>
  </div>

  <div id="status">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton tall"></div>
    <p class="center muted" style="margin-top:16px">正在获取油价数据…</p>
  </div>

  <div id="warning" hidden></div>
  <div id="hero" hidden></div>
  <div id="forecast" hidden></div>
  <div id="window" hidden></div>
  <div id="chart" hidden></div>
  <div id="provinces" hidden></div>
  <div id="history" hidden></div>
  <div id="footer" hidden></div>
</div>
<noscript><p style="padding:24px;text-align:center">本页需要启用 JavaScript 才能获取油价数据。</p></noscript>

<script>
(function () {
  "use strict";

  // ── 上游 ──────────────────────────────────────────────────────────────────
  var ENDPOINT = "https://datacenter-web.eastmoney.com/api/data/v1/get";
  var REPORT_HISTORY = "RPTA_WEB_YJ_BD";
  var REPORT_PROVINCES = "RPTA_WEB_YJ_JH";
  var REPORT_BRENT = "RPTA_WEB_JY_HQ";
  var HQ_TOKEN = "894050c76af8597a853f5b408b759f5d";
  var HISTORY_ROWS = 30;
  var BRENT_FETCH_ROWS = 500;
  var BRENT_PAYLOAD_ROWS = 60;
  var TIMEOUT_MS = 12000;
  var STORAGE_KEY = "oil-radar.h5.snapshot.v1";
  var CACHE_TTL_MS = 5 * 60 * 1000;
  var STALE_TTL_MS = 24 * 60 * 60 * 1000;

  // ── 预测校准（同 DSH 插件与小程序）──────────────────────────────────────
  var FORECAST_FACTOR = 4500;   // 元/吨 每 1% 原油变化率
  var FORECAST_MAE = 108;       // 平均绝对误差（元/吨）
  var FORECAST_HIT = 34;
  var FORECAST_TOTAL = 37;
  var STALL_THRESHOLD = 50;
  var LITRES_PER_TONNE = 1274;

  // ── 2026 年法定节假日与调休（国办发明电〔2025〕7号）────────────────────
  var HOLIDAYS = ["2026-01-01","2026-01-02","2026-01-03","2026-02-15","2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20","2026-02-21","2026-02-22","2026-02-23","2026-04-04","2026-04-05","2026-04-06","2026-05-01","2026-05-02","2026-05-03","2026-05-04","2026-05-05","2026-06-19","2026-06-20","2026-06-21","2026-09-25","2026-09-26","2026-09-27","2026-10-01","2026-10-02","2026-10-03","2026-10-04","2026-10-05","2026-10-06","2026-10-07"];
  var MAKEUP_WORKDAYS = ["2026-01-04","2026-02-14","2026-02-28","2026-05-09","2026-09-20","2026-10-10"];
  var OFFICIAL_WINDOWS = ["2026-10-15"];

  // ── 日期工具 ──────────────────────────────────────────────────────────────
  function dayMs(date){ return Date.UTC(+date.slice(0,4), +date.slice(5,7)-1, +date.slice(8,10)); }
  function isoDay(ms){ return new Date(ms).toISOString().slice(0,10); }
  function addDays(date, days){ return isoDay(dayMs(date) + days*86400000); }
  function isWorkday(date){
    if (MAKEUP_WORKDAYS.indexOf(date) >= 0) return true;
    var weekday = new Date(dayMs(date)).getUTCDay();
    if (weekday === 0 || weekday === 6) return false;
    return HOLIDAYS.indexOf(date) < 0;
  }
  function nextWindow(lastDate){
    var official = OFFICIAL_WINDOWS.filter(function(d){ return d > lastDate; }).sort()[0];
    if (official) return { date: official, source: "official" };
    var cursor = addDays(lastDate, 1), counted = 0;
    for (var i = 0; i < 500; i++){
      if (isWorkday(cursor)){ counted++; if (counted === 10) break; }
      cursor = addDays(cursor, 1);
    }
    return { date: cursor, source: "derived" };
  }
  function effectInstant(windowDate){ return Date.parse(addDays(windowDate,1) + "T00:00:00+08:00"); }
  function todayLocal(){
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  }
  function workingDaysBetween(from, to){
    var cursor = addDays(from,1), n = 0;
    for (var i = 0; i < 400 && cursor <= to; i++){
      if (isWorkday(cursor)) n++;
      cursor = addDays(cursor,1);
    }
    return n;
  }

  // ── 数值工具 ──────────────────────────────────────────────────────────────
  function num(v){ var n = typeof v === "number" ? v : Number(v); return isFinite(n) ? n : null; }
  function round(v, d){ var s = Math.pow(10, d); return Math.round(v*s)/s; }
  function median(values){
    var sorted = values.filter(function(v){ return typeof v === "number" && isFinite(v); }).sort(function(a,b){ return a-b; });
    if (!sorted.length) return null;
    var m = sorted.length >> 1;
    var v = sorted.length % 2 ? sorted[m] : (sorted[m-1]+sorted[m])/2;
    return Math.round(v*100)/100;
  }
  function brentAverage(brent, from, to){
    var sum = 0, days = 0;
    for (var i = 0; i < brent.length; i++){
      var p = brent[i];
      if (p.date > from && p.date <= to){ sum += p.close; days++; }
    }
    return days ? { avg: sum/days, days: days } : { avg: null, days: 0 };
  }

  // ── 预测 ──────────────────────────────────────────────────────────────────
  function buildForecast(brent, lastDate, previousDate, windowDate, through, litresPerTonne){
    if (!brent.length) return null;
    var cutoff = through < brent[brent.length-1].date ? through : brent[brent.length-1].date;
    var before = brentAverage(brent, previousDate, lastDate);
    var current = brentAverage(brent, lastDate, cutoff);
    if (before.avg === null || current.avg === null || before.avg === 0) return null;
    var rate = (current.avg - before.avg) / before.avg;
    var tonnes = rate * FORECAST_FACTOR;
    var stalled = Math.abs(tonnes) < STALL_THRESHOLD;
    var low = tonnes - FORECAST_MAE, high = tonnes + FORECAST_MAE;
    var factor = (isFinite(litresPerTonne) && litresPerTonne > 0) ? litresPerTonne : LITRES_PER_TONNE;
    return {
      direction: stalled ? "stall" : (tonnes > 0 ? "up" : "down"),
      stalled: stalled,
      rate: round(rate*100, 3),
      tonnes: Math.round(tonnes),
      minTonnes: Math.round(Math.min(low,high)),
      maxTonnes: Math.round(Math.max(low,high)),
      perLiter: round(Math.abs(tonnes)/factor, 3),
      minPerLiter: round(Math.min(Math.abs(low),Math.abs(high))/factor, 3),
      maxPerLiter: round(Math.max(Math.abs(low),Math.abs(high))/factor, 3),
      previousAverage: round(before.avg,2),
      currentAverage: round(current.avg,2),
      crudeDays: current.days,
      progress: { elapsed: workingDaysBetween(lastDate, cutoff), total: workingDaysBetween(lastDate, windowDate) },
      accuracy: { hit: FORECAST_HIT, total: FORECAST_TOTAL, mae: FORECAST_MAE },
      threshold: STALL_THRESHOLD,
      litresPerTonne: Math.round(factor)
    };
  }

  // ── 传输层：fetch 优先，失败退回 JSONP ───────────────────────────────────
  var transport = "fetch";

  function withTimeout(promise, ms){
    return new Promise(function(resolve, reject){
      var timer = setTimeout(function(){ reject(new Error("请求超时")); }, ms);
      promise.then(function(v){ clearTimeout(timer); resolve(v); },
                   function(e){ clearTimeout(timer); reject(e); });
    });
  }

  function rowsOf(body){
    var rows = body && body.result && body.result.data;
    if (!Array.isArray(rows)) throw new Error((body && body.message) || "上游无数据");
    return rows;
  }

  function fetchReport(params){
    var url = ENDPOINT + "?" + new URLSearchParams(Object.assign({}, params, { source: "WEB" })).toString();
    return withTimeout(fetch(url, { mode: "cors", credentials: "omit" }).then(function(response){
      if (!response.ok) throw new Error("HTTP " + response.status);
      return response.json();
    }), TIMEOUT_MS).then(rowsOf);
  }

  function jsonpReport(params){
    return new Promise(function(resolve, reject){
      var name = "__oilRadar" + Math.random().toString(36).slice(2);
      var script = document.createElement("script");
      var timer = setTimeout(function(){ cleanup(); reject(new Error("JSONP 超时")); }, TIMEOUT_MS);
      function cleanup(){
        clearTimeout(timer);
        try { delete window[name]; } catch (e) { window[name] = undefined; }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
      window[name] = function(body){ cleanup(); try { resolve(rowsOf(body)); } catch (e) { reject(e); } };
      script.onerror = function(){ cleanup(); reject(new Error("JSONP 加载失败")); };
      script.src = ENDPOINT + "?" + new URLSearchParams(Object.assign({}, params, { source: "WEB", callback: name })).toString();
      document.head.appendChild(script);
    });
  }

  function fetchReports(specs){
    return Promise.all(specs.map(fetchReport)).catch(function(error){
      if (transport === "jsonp") throw error;
      console.warn("[油价雷达] fetch 失败，改用 JSONP：" + error.message);
      transport = "jsonp";
      return Promise.all(specs.map(jsonpReport));
    });
  }

  // ── 快照 ──────────────────────────────────────────────────────────────────
  function buildSnapshot(useCloudUnused){
    var historySpec = { reportName: REPORT_HISTORY, columns: "ALL", sortColumns: "DIM_DATE", sortTypes: -1, pageNumber: 1, pageSize: HISTORY_ROWS };
    var brentSpec = { reportName: REPORT_BRENT, columns: "ALL", sortColumns: "date", sortTypes: -1, token: HQ_TOKEN, pageNumber: 1, pageSize: BRENT_FETCH_ROWS };
    return fetchReports([historySpec, brentSpec]).then(function(batch){
      var history = batch[0].map(function(row){
        return {
          date: String(row.DIM_DATE).slice(0,10),
          gasTon: num(row.VALUE), dieselTon: num(row.CY_JG),
          gasDelta: num(row.QY_FD), dieselDelta: num(row.CY_FD)
        };
      }).sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
      if (!history.length) throw new Error("未取到成品油调价记录");
      var last = history[history.length-1];

      var provinceSpec = { reportName: REPORT_PROVINCES, columns: "ALL", filter: "(DIM_DATE='" + last.date + "')", sortColumns: "FIRST_LETTER", sortTypes: 1, pageNumber: 1, pageSize: 100 };
      return fetchReports([provinceSpec]).then(function(pb){
        var provinces = pb[0].map(function(row){
          return {
            name: String(row.CITYNAME),
            p92: num(row.V92), p95: num(row.V95), p89: num(row.V89), p0: num(row.V0),
            d92: num(row.ZDE92), d95: num(row.ZDE95), d89: num(row.ZDE89), d0: num(row.ZDE0)
          };
        });
        var brent = batch[1].map(function(row){ return { date: String(row.DATE).slice(0,10), close: num(row.CLOSE) }; })
          .filter(function(p){ return p.close !== null; })
          .sort(function(a,b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

        var win = nextWindow(last.date);
        var observedGas = median(provinces.map(function(p){ return p.d92; }));
        var litresPerTonne = (observedGas !== null && observedGas !== 0 && isFinite(last.gasDelta))
          ? Math.abs(last.gasDelta) / observedGas : LITRES_PER_TONNE;

        return {
          ok: true,
          transport: transport,
          fetchedAt: new Date().toISOString(),
          last: Object.assign({}, last, {
            perLiter: {
              p92: median(provinces.map(function(p){ return p.d92; })),
              p95: median(provinces.map(function(p){ return p.d95; })),
              p0: median(provinces.map(function(p){ return p.d0; }))
            }
          }),
          history: history,
          provinces: provinces,
          brent: brent.slice(-BRENT_PAYLOAD_ROWS),
          forecast: buildForecast(brent, last.date, history.length >= 2 ? history[history.length-2].date : last.date, win.date, todayLocal(), litresPerTonne),
          next: { date: win.date, source: win.source, effectAt: effectInstant(win.date), cycleStart: last.date },
          sources: [
            { label: "东方财富数据中心 · 国内成品油调价", url: "https://data.eastmoney.com/cjsj/oil_default.html" },
            { label: "国家发改委 · 成品油价格调整", url: "https://www.ndrc.gov.cn/" }
          ]
        };
      });
    });
  }

  // ── 缓存 ──────────────────────────────────────────────────────────────────
  function readCache(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      return parsed && parsed.savedAt ? parsed : null;
    } catch (e) { return null; }
  }
  function writeCache(payload){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ savedAt: Date.now(), payload: payload })); }
    catch (e) { console.warn("[油价雷达] 缓存写入失败", e); }
  }

  function load(force){
    var cached = readCache();
    if (!force && cached && Date.now() - cached.savedAt < CACHE_TTL_MS){
      return Promise.resolve(Object.assign({}, cached.payload, { fromCache: true, stale: false, savedAt: cached.savedAt }));
    }
    return buildSnapshot().then(function(payload){
      writeCache(payload);
      return Object.assign({}, payload, { fromCache: false, stale: false, savedAt: Date.now() });
    }).catch(function(error){
      var message = (error && error.message) || String(error);
      if (cached && Date.now() - cached.savedAt < STALE_TTL_MS){
        return Object.assign({}, cached.payload, { fromCache: true, stale: true, savedAt: cached.savedAt, warning: "刷新失败，显示上次数据：" + message });
      }
      return { ok: false, error: message };
    });
  }

  // ── 格式化 ────────────────────────────────────────────────────────────────
  function pad(n){ return String(n).padStart(2,"0"); }
  function fixed(v, d){ return (typeof v === "number" && isFinite(v)) ? v.toFixed(d || 0) : "—"; }
  function signed(v, d){
    if (typeof v !== "number" || !isFinite(v)) return "—";
    return (v > 0 ? "↑" : v < 0 ? "↓" : "→") + (v > 0 ? "+" : "") + v.toFixed(d || 0);
  }
  function tone(v){ return (typeof v !== "number" || !isFinite(v) || v === 0) ? "flat" : (v > 0 ? "up" : "down"); }
  function stamp(ms){
    var d = new Date(ms);
    return pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  // ── 渲染 ──────────────────────────────────────────────────────────────────
  var el = function(id){ return document.getElementById(id); };
  var state = { payload: null, query: "" };

  function renderTopbar(payload){
    el("meta").textContent = "更新于 " + stamp(payload.savedAt || Date.now()) +
      " · " + (payload.transport === "jsonp" ? "JSONP" : "直连") +
      (payload.fromCache ? " · 缓存" : "");
    el("topbar").hidden = false;
  }

  function renderHero(payload){
    var last = payload.last, t = tone(last.gasDelta);
    el("hero").innerHTML =
      '<div class="hero">' +
        '<div class="hero-top"><span class="hero-title">最新一轮调价</span>' +
        '<span class="hero-badge">' + (last.gasDelta > 0 ? "上调" : last.gasDelta < 0 ? "下调" : "搁浅") + '</span></div>' +
        '<span class="hero-date">' + last.date + '</span>' +
        '<span class="hero-delta ' + t + '">' + signed(last.gasDelta) + '<span class="hero-unit">元/吨</span></span>' +
        '<div class="hero-grid">' +
          '<div class="hero-cell"><span class="hero-k">汽油</span><span class="hero-v">' + fixed(last.gasTon) + '</span><span class="hero-u">元/吨 ' + signed(last.gasDelta) + '</span></div>' +
          '<div class="hero-cell"><span class="hero-k">柴油</span><span class="hero-v">' + fixed(last.dieselTon) + '</span><span class="hero-u">元/吨 ' + signed(last.dieselDelta) + '</span></div>' +
        '</div>' +
        '<div class="hero-foot">折合 92# ' + signed(last.perLiter.p92, 2) + ' 元/升 · 0# ' + signed(last.perLiter.p0, 2) + ' 元/升（各省中位）</div>' +
      '</div>';
    el("hero").hidden = false;
  }

  function renderForecast(payload){
    var f = payload.forecast;
    if (!f){
      el("forecast").innerHTML = '<div class="card"><div class="card-head"><span class="card-title">下一轮调价预测</span></div><div class="muted">原油数据不足，暂无法预测。</div></div>';
      el("forecast").hidden = false;
      return;
    }
    var t = f.direction === "up" ? "up" : f.direction === "down" ? "down" : "flat";
    var arrow = f.direction === "up" ? "↑" : f.direction === "down" ? "↓" : "→";
    var label = f.direction === "up" ? "预计上调" : f.direction === "down" ? "预计下调" : "预计搁浅";
    var mag = f.stalled ? "—" : arrow + (f.tonnes > 0 ? "+" : "−") + Math.abs(f.tonnes);
    el("forecast").innerHTML =
      '<div class="card">' +
        '<div class="card-head"><span class="card-title">下一轮调价预测</span><span class="chip">估算</span></div>' +
        '<div class="fc-main"><span class="fc-mag ' + t + '">' + mag + '</span><span class="fc-unit">元/吨</span></div>' +
        '<div class="fc-badge ' + t + '">' + arrow + ' ' + label + '</div>' +
        '<div class="divider"></div>' +
        '<div class="kv"><span class="kv-k">折合区间</span><span class="kv-v">' + f.minPerLiter + ' ~ ' + f.maxPerLiter + ' 元/升</span></div>' +
        '<div class="kv"><span class="kv-k">原油变化率</span><span class="kv-v">' + (f.rate > 0 ? "+" : "") + f.rate + '%</span></div>' +
        '<div class="kv"><span class="kv-k">周期进度</span><span class="kv-v">' + f.progress.elapsed + '/' + f.progress.total + ' 工作日</span></div>' +
        '<div class="kv"><span class="kv-k">方向历史命中</span><span class="kv-v">' + f.accuracy.hit + '/' + f.accuracy.total + '</span></div>' +
        '<div class="note">' + (f.stalled
            ? "幅度不足 " + f.threshold + " 元/吨时按惯例不调价（搁浅）。"
            : "越接近窗口越准；区间为 ±" + f.accuracy.mae + " 元/吨的历史平均绝对误差。") +
          '布伦特均价 ' + f.previousAverage + ' → ' + f.currentAverage + ' 美元/桶。</div>' +
      '</div>';
    el("forecast").hidden = false;
  }

  function renderWindow(payload){
    var w = payload.next;
    el("window").innerHTML =
      '<div class="card">' +
        '<div class="card-head"><span class="card-title">下一轮调价窗口</span>' +
        '<span class="chip' + (w.source === "official" ? " chip-live" : "") + '">' + (w.source === "official" ? "官方已公布" : "按规则推算") + '</span></div>' +
        '<div id="cd-live"></div>' +
        '<div class="note">' + w.date + ' 24:00 起执行 · 本轮计价周期自 ' + w.cycleStart + ' 起</div>' +
      '</div>';
    el("window").hidden = false;
    state.effectAt = w.effectAt;
    tick();
  }

  function tick(){
    var host = el("cd-live");
    if (!host || !state.effectAt) return;
    var remain = state.effectAt - Date.now();
    if (remain <= 0){
      if (!host.dataset.expired){
        host.dataset.expired = "1";
        host.innerHTML = '<div class="cd-expired">窗口已到，等待发改委公布</div>';
      }
      return;
    }
    if (host.dataset.expired) { delete host.dataset.expired; host.innerHTML = ""; }
    var total = Math.floor(remain / 1000);
    var parts = [
      { v: Math.floor(total/86400), u: "天", show: Math.floor(total/86400) > 0 },
      { v: pad(Math.floor((total%86400)/3600)), u: "时", show: true },
      { v: pad(Math.floor((total%3600)/60)), u: "分", show: true },
      { v: pad(total%60), u: "秒", show: true }
    ];
    var html = parts.filter(function(p){ return p.show; }).map(function(p){
      return '<div class="cd-cell"><span class="cd-num">' + p.v + '</span><span class="cd-unit">' + p.u + '</span></div>';
    }).join("");
    host.innerHTML = '<div class="countdown">' + html + '</div>';
  }

  function renderChart(payload){
    var rows = payload.history.slice(-14);
    if (rows.length < 2){ el("chart").hidden = true; return; }
    var W = 720, H = 280, L = 46, R = W - 10, top = 18, bottom = 168, barTop = 196, barBottom = 252;
    var values = [];
    rows.forEach(function(r){ values.push(r.gasTon, r.dieselTon); });
    var min = Math.min.apply(null, values), max = Math.max.apply(null, values);
    var span = (max - min) || 1;
    var x = function(i){ return L + i * (R - L) / (rows.length - 1); };
    var y = function(v){ return bottom - (v - min) / span * (bottom - top); };
    var path = function(key){
      return rows.map(function(r, i){ return (i ? "L" : "M") + x(i).toFixed(1) + "," + y(r[key]).toFixed(1); }).join(" ");
    };
    var peak = Math.max(1, Math.max.apply(null, rows.map(function(r){ return Math.abs(r.gasDelta || 0); })));
    var mid = (barTop + barBottom) / 2;
    var bw = Math.max(3, (R - L) / rows.length * 0.5);
    var bars = rows.map(function(r, i){
      var v = r.gasDelta || 0;
      var h = Math.max(1, Math.abs(v) / peak * (barBottom - barTop) / 2);
      var yy = v >= 0 ? mid - h : mid;
      var fill = v > 0 ? "var(--up)" : v < 0 ? "var(--down)" : "var(--ink-3)";
      return '<rect x="' + (x(i)-bw/2).toFixed(1) + '" y="' + yy.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="1.5" fill="' + fill + '" opacity=".75"/>';
    }).join("");
    var ticks = [0, .5, 1].map(function(ratio){
      var v = min + span * ratio, yy = y(v);
      return '<line x1="' + L + '" x2="' + R + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>' +
             '<text x="' + (L-6) + '" y="' + (yy+4).toFixed(1) + '" text-anchor="end" font-size="11" fill="var(--ink-3)">' + Math.round(v) + '</text>';
    }).join("");
    var labels = [0, rows.length - 1].map(function(i){
      return '<text x="' + x(i).toFixed(1) + '" y="' + (H-8) + '" text-anchor="' + (i ? "end" : "start") + '" font-size="11" fill="var(--ink-3)">' + rows[i].date + '</text>';
    }).join("");
    var first = payload.history[0].gasTon;

    el("chart").innerHTML =
      '<div class="card">' +
        '<div class="card-head"><span class="card-title">汽油 / 柴油 出厂价</span><span class="card-note">元/吨</span></div>' +
        '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img">' +
          ticks +
          '<line x1="' + L + '" x2="' + R + '" y1="' + mid + '" y2="' + mid + '" stroke="var(--line)" stroke-width="1"/>' +
          bars +
          '<path d="' + path("dieselTon") + '" fill="none" stroke="var(--diesel)" stroke-width="1.8"/>' +
          '<path d="' + path("gasTon") + '" fill="none" stroke="var(--gas)" stroke-width="2.2"/>' +
          labels +
        '</svg>' +
        '<div class="legend">' +
          '<span><i style="background:var(--gas)"></i>汽油</span>' +
          '<span><i style="background:var(--diesel)"></i>柴油</span>' +
          '<span><i style="background:var(--up)"></i>涨</span>' +
          '<span><i style="background:var(--down)"></i>跌</span>' +
        '</div>' +
        '<div class="note">汽油价（近 ' + payload.history.length + ' 期）' + fixed(first) + ' → ' + fixed(payload.last.gasTon) + ' 元/吨</div>' +
      '</div>';
    el("chart").hidden = false;
  }

  function provinceRows(rows, query){
    var q = (query || "").trim();
    var list = rows.filter(function(r){ return q === "" || r.name.indexOf(q) >= 0; });
    if (!list.length) return '<div class="center muted" style="padding:24px 0">没有匹配的省份</div>';
    return list.map(function(r){
      return '<div class="row">' +
        '<span class="c-name">' + esc(r.name) + '</span>' +
        '<span class="c-num">' + fixed(r.p92,2) + '</span>' +
        '<span class="c-num">' + fixed(r.p95,2) + '</span>' +
        '<span class="c-num">' + fixed(r.p0,2) + '</span>' +
        '<span class="c-delta ' + tone(r.d92) + '">' + signed(r.d92,2) + '</span>' +
      '</div>';
    }).join("");
  }

  function renderProvinces(payload){
    el("provinces").innerHTML =
      '<div class="card">' +
        '<div class="card-head"><span class="card-title">各省零售价</span><span class="card-note">' + payload.provinces.length + ' 个地区 · 元/升</span></div>' +
        '<div class="search"><input id="province-search" type="search" placeholder="搜索省份，如 山东" value="' + esc(state.query) + '"><button id="province-clear" type="button" hidden>清除</button></div>' +
        '<div class="row head"><span class="c-name">地区</span><span class="c-num">92#</span><span class="c-num">95#</span><span class="c-num">0#</span><span class="c-delta">92#涨跌</span></div>' +
        '<div class="rows" id="province-rows">' + provinceRows(payload.provinces, state.query) + '</div>' +
      '</div>';
    el("provinces").hidden = false;

    var input = el("province-search"), clear = el("province-clear");
    clear.hidden = state.query === "";
    input.addEventListener("input", function(){
      state.query = input.value;
      clear.hidden = state.query === "";
      document.getElementById("province-rows").innerHTML = provinceRows(payload.provinces, state.query);
    });
    clear.addEventListener("click", function(){
      state.query = "";
      input.value = "";
      clear.hidden = true;
      document.getElementById("province-rows").innerHTML = provinceRows(payload.provinces, "");
    });
  }

  function renderHistory(payload){
    var rows = payload.history.slice().reverse().map(function(r){
      return '<div class="row" data-copy="' + r.date + '|' + r.gasTon + '|' + signed(r.gasDelta) + '|' + r.dieselTon + '|' + signed(r.dieselDelta) + '">' +
        '<span class="c-date">' + r.date + '</span>' +
        '<span class="c-num">' + fixed(r.gasTon) + '</span>' +
        '<span class="c-delta ' + tone(r.gasDelta) + '">' + signed(r.gasDelta) + '</span>' +
        '<span class="c-num">' + fixed(r.dieselTon) + '</span>' +
        '<span class="c-delta ' + tone(r.dieselDelta) + '">' + signed(r.dieselDelta) + '</span>' +
      '</div>';
    }).join("");
    el("history").innerHTML =
      '<div class="card">' +
        '<div class="card-head"><span class="card-title">历史调价记录</span><span class="card-note">近 ' + payload.history.length + ' 期 · 元/吨</span></div>' +
        '<div class="row head"><span class="c-date">日期</span><span class="c-num">汽油</span><span class="c-delta">涨跌</span><span class="c-num">柴油</span><span class="c-delta">涨跌</span></div>' +
        '<div class="rows">' + rows + '</div>' +
      '</div>';
    el("history").hidden = false;

    el("history").addEventListener("click", function(event){
      var row = event.target.closest("[data-copy]");
      if (!row) return;
      var parts = row.getAttribute("data-copy").split("|");
      var text = parts[0] + " 汽油 " + parts[1] + " 元/吨（" + parts[2] + "）、柴油 " + parts[3] + " 元/吨（" + parts[4] + "）";
      if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function(){});
    });
  }

  function renderFooter(payload){
    el("footer").innerHTML =
      '<div class="foot">' +
        '<div class="foot-title">数据来源</div>' +
        (payload.sources || []).map(function(s){
          return '<a href="' + esc(s.url) + '" target="_blank" rel="noopener">· ' + esc(s.label) + '</a>';
        }).join("") +
        '<div class="foot-note">调价窗口按「10 个工作日」规则推算，已公布的窗口优先；预测为估算，最终价格以国家发改委公布为准。</div>' +
      '</div>';
    el("footer").hidden = false;
  }

  function renderError(message){
    el("status").innerHTML =
      '<div class="card"><div class="card-title">获取数据失败</div>' +
      '<div class="err">' + esc(message) + '</div>' +
      '<div class="note">请检查手机网络是否可访问互联网；若使用微信打开，可点右上角「…」选择在浏览器中打开。</div>' +
      '<button class="btn" id="btn-retry" type="button">重试</button></div>';
    el("status").hidden = false;
    var retry = el("btn-retry");
    if (retry) retry.addEventListener("click", function(){ refresh(true); });
  }

  function render(payload){
    if (!payload.ok){ renderError(payload.error || "未知错误"); return; }
    state.payload = payload;
    el("status").hidden = true;
    el("warning").hidden = !payload.warning;
    if (payload.warning) el("warning").innerHTML = '<div class="warn">' + esc(payload.warning) + '</div>';
    renderTopbar(payload);
    renderHero(payload);
    renderForecast(payload);
    renderWindow(payload);
    renderChart(payload);
    renderProvinces(payload);
    renderHistory(payload);
    renderFooter(payload);
  }

  function refresh(force){
    var button = el("btn-refresh");
    if (button) button.textContent = "刷新中…";
    return load(!!force).then(function(payload){
      render(payload);
    }).catch(function(error){
      renderError((error && error.message) || String(error));
    }).then(function(){
      var b = el("btn-refresh");
      if (b) b.textContent = "刷新";
    });
  }

  // ── 启动 ──────────────────────────────────────────────────────────────────
  function boot(){
    var button = el("btn-refresh");
    if (button) button.addEventListener("click", function(){ refresh(true); });
    refresh(false);

    setInterval(tick, 1000);
    setInterval(function(){ refresh(false); }, CACHE_TTL_MS);
    document.addEventListener("visibilitychange", function(){
      if (!document.hidden) refresh(false);
    });
  }

  // 挂到全局便于在手机控制台排查
  window.OilRadar = {
    version: "1.0.0",
    load: load,
    render: render,
    refresh: refresh,
    buildSnapshot: buildSnapshot,
    nextWindow: nextWindow,
    debug: function(){ return state.payload; }
  };

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
</html>
